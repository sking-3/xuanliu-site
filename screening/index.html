  <title>Books · A股研究与选股</title>

<body class="books-shell research-page"><section class="index-ticker" id="index-ticker" aria-label="全球指数行情"><iframe src="../market-strip.html?v=compact-20261123-1" title="全球指数行情"></iframe></section><a class="skip-link" href="#content">跳到股票筛选</a>
  <aside class="books-sidebar" aria-label="研究导航"><a class="books-brand" href="../index.html">Books<span>RESEARCH STUDIO</span></a><nav class="books-nav" aria-label="工作区"><a href="../index.html">市场总览</a><a href="../screening/index.html" aria-current="page">A股选股</a><a href="../us.html">美股选股</a><a href="../trader/index.html">带单员广场</a><a href="../research.html">公司研究</a><a href="../screening/history.html">历史研究</a><a href="../academy/index.html">交易员研习</a><a href="../tools.html">研究工具</a></nav><nav class="books-shortcuts" aria-label="行情快捷入口"><a href="../a-shares.html">A 股行情</a><a href="../us-live.html">美股监控</a><a href="../crypto.html">加密行情</a></nav><p class="books-side-note">独立研究 · 证据优先</p></aside>

  <main id="content" class="stock-main" tabindex="-1">
    <header class="stock-page-heading stock-desk-heading">
      <h1>A股选股</h1>
      <div class="stock-desk-batch">
        <span id="stock-desk-date">数据日待核验</span>
        <p id="stock-desk-status" role="status" aria-live="polite">等待载入已完成的选股批次</p>
      </div>
    </header>

    <section id="stock-desk" class="stock-desk" aria-label="选股工作台" data-state="waiting">
      <div id="stock-desk-tabs" class="stock-desk-tabs" role="tablist" aria-label="选股视图">
        <button id="stock-desk-candidates-tab" type="button" role="tab" aria-selected="true" aria-controls="stock-desk-candidates" disabled>候选</button>
        <button id="stock-desk-tracking-tab" type="button" role="tab" aria-selected="false" aria-controls="stock-desk-tracking" tabindex="-1" disabled>3日跟踪</button>
      </div>

      <form id="stock-desk-filter-form" class="stock-desk-filter-form">
        <fieldset id="stock-desk-filters" class="stock-desk-filters" disabled>
          <legend class="stock-desk-sr-only">筛选候选</legend>
          <label for="stock-desk-phase">时点
            <select id="stock-desk-phase" name="phase">
              <option value="close" selected>收盘</option>
              <option value="a14">14:00</option>
            </select>
          </label>
          <label for="stock-desk-strategy">策略
            <select id="stock-desk-strategy" name="strategy">
              <option value="all" selected>全部策略</option>
              <option value="trend">趋势</option>
              <option value="short-term">短线涨停</option>
              <option value="institution">机构</option>
              <option value="t-plan">区间做T（底仓）</option>
            </select>
          </label>
          <label for="stock-desk-shape">形态
            <select id="stock-desk-shape" name="shape"><option value="all">全部形态</option></select>
          </label>
          <label for="stock-desk-query">股票
            <input id="stock-desk-query" name="query" type="search" placeholder="代码或名称" autocomplete="off">
          </label>
        </fieldset>
      </form>

      <p id="stock-desk-source" class="stock-desk-source">来源日期与读取时间待核验</p>
      <p id="stock-desk-market-position" class="stock-desk-market-position" hidden></p>
      <p id="stock-desk-error" class="stock-desk-error" role="alert" hidden></p>

      <section id="stock-desk-candidates" class="stock-desk-panel" role="tabpanel" aria-labelledby="stock-desk-candidates-tab" aria-busy="true">
        <div class="stock-desk-result-bar">
          <p id="stock-desk-count">候选结果待载入</p>
          <button id="stock-desk-refresh" type="button" hidden disabled>重新读取</button>
        </div>
        <div id="stock-desk-results" class="stock-desk-results" role="list" aria-label="筛选后的股票"></div>
        <div id="stock-desk-empty" class="stock-desk-empty" role="status">
          <p>等待载入本站选股结果</p>
          <span>核验完成后，在此显示股票和日K。</span>
        </div>
      </section>

      <section id="stock-desk-tracking" class="stock-desk-panel" role="tabpanel" aria-labelledby="stock-desk-tracking-tab" aria-busy="true" hidden>
        <div class="stock-desk-result-bar"><p id="stock-desk-tracking-count">跟踪记录待载入</p></div>
        <table class="stock-desk-track-table">
          <caption class="stock-desk-sr-only">同一候选记录的3个交易日后续表现</caption>
          <thead><tr><th scope="col">股票</th><th scope="col">确认日</th><th scope="col">状态</th><th scope="col">3日变化</th><th scope="col">来源时点</th></tr></thead>
          <tbody id="stock-desk-tracking-rows"></tbody>
        </table>
        <p id="stock-desk-tracking-empty" class="stock-desk-empty">等待载入已确认记录</p>
      </section>
      <noscript><p class="stock-desk-empty">启用JavaScript后可读取选股结果。</p></noscript>
    </section>

    <template id="stock-desk-card-template">
      <article class="stock-desk-card" role="listitem" data-stock-desk-card>
        <header class="stock-desk-card-heading">
          <div class="stock-desk-stock">
            <h2 data-stock-desk-name></h2>
            <span data-stock-desk-code></span>
          </div>
          <span class="stock-desk-stage" data-stock-desk-stage></span>
        </header>
        <p class="stock-desk-reason" data-stock-desk-reason></p>
        <p class="stock-desk-position" data-stock-desk-position hidden></p>
        <section class="stock-desk-plan" data-stock-desk-plan hidden aria-label="下一交易日条件计划">
          <h3 data-stock-desk-plan-title>下一交易日条件计划</h3>
          <dl class="stock-desk-plan-levels" data-stock-desk-plan-levels></dl>
          <p data-stock-desk-plan-note></p>
        </section>
        <div class="stock-desk-chart" data-stock-desk-chart></div>
        <p class="stock-desk-chart-note">每根为1个交易日；窗口不是持仓或预测期；纵轴以窗口首日收盘为0%。</p>
        <p class="stock-desk-card-source" data-stock-desk-source></p>
        <div class="stock-desk-inline">
          <details data-stock-desk-research>
            <summary>个股研究</summary>
            <div data-stock-desk-research-body></div>
            <div class="stock-desk-analogue" data-stock-desk-analogue hidden></div>
          </details>
          <details data-stock-desk-institution>
            <summary>机构披露</summary>
            <div data-stock-desk-institution-body></div>
          </details>
        </div>
      </article>
    </template>
  </main>
<script defer src="stock-desk-controller.js?v=stock-position-20261125-1"></script>
</body>
</html>
