name: Set up public release checks
description: Install pinned test dependencies without contacting market sources
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v6
      with:
        node-version: '24'
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - shell: bash
      run: |
        set -euo pipefail
        npm install --prefix "$RUNNER_TEMP/public-release-tools" --no-audit --no-fund --ignore-scripts playwright@1.56.1
        for file in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt /etc/apt/apt-mirrors-security.txt; do
          if [ -f "$file" ]; then
            sudo sed -Ei 's#https?://([a-z0-9-]+\.)*ec2\.archive\.ubuntu\.com/ubuntu/?#https://archive.ubuntu.com/ubuntu/#g' "$file"
          fi
        done
        printf '%s\n' 'Acquire::Retries "1";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' |
          sudo tee /etc/apt/apt.conf.d/99books-ci-timeout >/dev/null
        timeout --signal=TERM --kill-after=15s 6m "$RUNNER_TEMP/public-release-tools/node_modules/.bin/playwright" install --with-deps chromium webkit
        python3 -m pip install lxml==6.1.3
        echo "NODE_PATH=$RUNNER_TEMP/public-release-tools/node_modules" >> "$GITHUB_ENV"
