name: Copy signal offline checks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/copy_plan/**', '.github/workflows/copy-signal-dry-run.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -B -m unittest discover -s tools/copy_plan -p 'test_*.py'
