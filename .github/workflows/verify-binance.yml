name: Verify Binance monitor

on:
  push:
    branches: ['codex/binance-monitor-20261110', 'codex/binance-multi-20261110']
  pull_request:
    paths:
      - 'scripts/collect_binance.cjs'
      - 'scripts/binance_run_guard.cjs'
      - '.github/workflows/refresh-traders.yml'
      - 'audit/binance-*.cjs'
      - 'trader/binance/**'
      - 'trader/index.html'
      - '.github/workflows/verify-binance.yml'

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Check collector, display, and existing trader page
        run: |
          node --check scripts/collect_binance.cjs
          node --check trader/binance/monitor.js
          node audit/binance-collector-unit.cjs
          node audit/binance-multi-unit.cjs
          node audit/binance-run-guard-unit.cjs
          node audit/binance-ui-unit.cjs
          node audit/shell-unit.cjs
          node audit/trader-unit.cjs
          node audit/account-live-unit.cjs
          node audit/account-analytics-unit.cjs
      - name: Check registered portfolio data without network access
        run: |
          node -e "const fs=require('node:fs');const c=require('./scripts/collect_binance.cjs');const u=require('./trader/binance/monitor.js');const p=c.validateCollection(JSON.parse(fs.readFileSync('trader/binance/portfolios.json','utf8')));u.parseCollection(p);if(JSON.stringify(c.PORTFOLIOS.map(x=>x.id).sort())!==JSON.stringify(Object.keys(u.PORTFOLIOS).sort()))process.exit(1);console.log(p.portfolios.map(s=>({id:s.portfolioId,status:s.source.status,positions:s.snapshot?.positions.length})));if(p.portfolios.some(s=>s.source.status==='ready'&&!s.snapshot?.complete))process.exit(1);"
