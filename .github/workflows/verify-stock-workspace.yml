name: Verify stock workspace offline
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python3 -B -m unittest tools.stock_research.test_engine -v
      - run: node --test audit/stock-workspace-unit.cjs
      - run: node audit/trader-unit.cjs
