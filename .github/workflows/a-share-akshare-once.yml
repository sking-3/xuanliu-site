name: A-share AKShare verification once

on:
  push:
    paths:
      - ".github/workflows/a-share-akshare-once.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install AKShare adapter
        run: python -m pip install "akshare>=1.17,<2" "pandas>=2.0,<3"
      - name: Collect end of day data and build anomaly radar
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/a-share/eod"
          python scripts/collect_a_share.py             --provider akshare             --mode eod             --max-symbols 10             --output-dir "$RUNNER_TEMP/a-share/eod" | tee "$RUNNER_TEMP/eod-result.json"
          python - <<'PY'
          import json
          from pathlib import Path
          snapshot = json.loads((Path("$RUNNER_TEMP") / "a-share/eod/snapshot.json").read_text())
          market = snapshot.get("markets", {}).get("a", {})
          print("eod_market_status=", market.get("status"))
          print("eod_rows=", len(market.get("rows", [])))
          print("anomaly_radar_alerts=", len(snapshot.get("alerts", [])))
          PY
      - name: Collect 14:00 research batch
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/a-share/a14"
          python scripts/collect_a_share.py             --provider akshare             --mode a14             --max-symbols 10             --output-dir "$RUNNER_TEMP/a-share/a14" | tee "$RUNNER_TEMP/a14-result.json"
      - name: Summarize 14:00 result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads((Path("$RUNNER_TEMP") / "a-share/a14/books.a14.preselection.json").read_text())
          print("a14_status=", result.get("status"))
          print("a14_counts=", result.get("counts"))
          print("a14_blockers=", result.get("blockers"))
          PY
      - name: Keep outputs ephemeral
        run: echo "No provider rows, snapshots, or artifacts are uploaded."
