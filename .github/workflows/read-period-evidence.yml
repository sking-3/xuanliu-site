name: Read public period evidence
on:
  push:
    branches: [ui/verified-long-period-roi]
    paths: ['.github/workflows/read-period-evidence.yml']
permissions: {}
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify paired historical window boundaries
        shell: node {0}
        run: |
          'use strict';
          const fs=require('node:fs/promises');
          async function main() {
            const ids=["0x1f250df59a777d61cb8bd043c12970f3afe4f925","0x20717220daa3fa24cd9ed4c8d8fabe79921ba513","0x1f57058d2a45568f9879ccc746d55dd16cf99671","0x37b9efbb4c16e2b1cd03fc03e65e2e45f722b61d","0x069ad3d4dd1ca686ef78d065fbc6208fdcede58d","0x8190ff234a578aba075fbb6bbc3b8a77f42b44fe","0x97f21dfa04ba0d74defe9fc4de1fd19a6d078f6f","0x3fccfafa0915bb70e077c381a4c49315b72b78d4","0x7c27f4de1cad1b759fefa780e1158c8c8976c626","0x184cd9380cc279c34443052775ab42fe63356b5e"];
            for (const id of ids) {
              if(!/^0x[0-9a-f]{40}$/.test(id)) throw Error('invalid account');
              const res=await fetch('https://api.hyperliquid.xyz/info',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({type:'portfolio',user:id}),signal:AbortSignal.timeout(12000)});
              if([403,429].includes(res.status)) { console.log('Stopped after HTTP '+res.status); return; }
              if(!res.ok) {console.log(JSON.stringify({account:id,http:res.status}));return;}
              const data=await res.json();
              const all=data.find(tuple=>tuple[0]==='perpAllTime')?.[1];
              const pnl=all?.pnlHistory;
              const eq=all?.accountValueHistory;
              if(!Array.isArray(pnl)||!Array.isArray(eq)||!pnl.length){console.log(JSON.stringify({account:id,error:'missing paired series'}));continue;}
              const equityTimes=new Set(eq.map(x=>x[0]));
              const times=pnl.map(x=>x[0]).filter(t=>equityTimes.has(t)).sort((a,b)=>a-b);
              const end=times.at(-1),endGapHours=(Date.now()-end)/3600000;
              const windows={};
              for(const days of [90,365]){
                const start=end-86400000*days;
                windows[days]={hasStart:times.includes(start),historyDays:(end-times[0])/86400000,coveredDays:(end-times.find(t=>t>=start))/86400000};
              }
              console.log(JSON.stringify({account:id,asOf:new Date(end).toISOString(),ageHours:endGapHours,windows}));
              await new Promise(resolve=>setTimeout(resolve,2100));
            }
          }
          main().catch(e=>{console.error(e.message);process.exitCode=1;});
