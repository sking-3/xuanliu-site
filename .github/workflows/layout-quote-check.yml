name: Verify six ticker closing sources
on:
  push:
    branches: [ui/home-ticker-ranking-fit]
    paths: ['.github/workflows/layout-quote-check.yml']
permissions: {}
jobs:
  capture:
    runs-on: ubuntu-latest
    outputs:
      rows: ${{ steps.quotes.outputs.rows }}
    steps:
      - id: quotes
        shell: python
        run: |
          import concurrent.futures, json, datetime, urllib.parse, urllib.request, math, os
          items = [
              ('SSE:000001','上证指数','sh000001','000001.SS'),
              ('SZSE:399001','深证成指','sz399001','399001.SZ'),
              ('SZSE:399006','创业板指','sz399006','399006.SZ'),
              ('SSE:000688','科创50','sh000688','000688.SS'),
              ('HSI:HSI','恒生指数','hkHSI','^HSI'),
              ('FRED:NDQCOM','纳斯达克综合','us.IXIC','^IXIC'),
          ]
          def read(url):
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'application/json,text/csv,*/*'})
              with urllib.request.urlopen(req,timeout=8) as res: return res.read()
          def bars(item):
              sym,name,code,yahoo=item
              apis=['fqkline']
              if code.startswith('hk'):apis.insert(0,'hkfqkline')
              if code.startswith('us'):apis.insert(0,'usfqkline')
              endpoints=[('腾讯行情',f'{host}/appstock/app/{api}/get?param={code},day,,,10,qfq') for api in apis for host in ['https://web.ifzq.gtimg.cn','https://proxy.finance.qq.com/ifzqgtimg']]
              endpoints += [('Yahoo Finance','https://'+host+'/v8/finance/chart/'+urllib.parse.quote(yahoo,safe='')+'?range=10d&interval=1d') for host in ['query1.finance.yahoo.com','query2.finance.yahoo.com']]
              if sym=='FRED:NDQCOM': endpoints.append(('FRED','https://fred.stlouisfed.org/graph/fredgraph.csv?id=NASDAQCOM&cosd=2026-11-01'))
              for src,url in endpoints:
                  try:
                      raw=read(url)
                      if src=='腾讯行情':
                          entry=json.loads(raw)['data'][code]; vals=entry.get('qfqday',entry.get('day'))
                          xs=[(r[0],float(r[2])) for r in vals]
                      elif src=='Yahoo Finance':
                          from zoneinfo import ZoneInfo
                          r=json.loads(raw)['chart']['result'][0]; tz=ZoneInfo(r['meta']['exchangeTimezoneName'])
                          xs=[(datetime.datetime.fromtimestamp(t,tz).date().isoformat(),v) for t,v in zip(r['timestamp'],r['indicators']['quote'][0]['close']) if v is not None]
                      else:
                          xs=[(line.split(',')[0],float(line.split(',')[1])) for line in raw.decode().splitlines()[1:] if line.split(',')[-1] not in ('','.')]
                      xs=sorted((d,v) for d,v in xs if d<=datetime.datetime.now(datetime.timezone.utc).date().isoformat() and v>0 and math.isfinite(v))
                      if len(xs)<2 or xs[-1][0]==xs[-2][0]:raise ValueError('missing daily pair')
                      q=entry.get('qt',{}).get(code,[]) if src=='腾讯行情' else []
                      return dict(symbol=sym, ticker=code, fields={i:q[i] for i in (1,2,3,4,30,31,32) if len(q)>i},bar=xs[-1],prev=xs[-2])
                  except Exception as e:print('attempt',sym,src,str(e)[:160],flush=True)
              return dict(symbol=sym,error='unavailable')
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool: rows=list(pool.map(bars,items))
          serialized=[json.dumps(x,ensure_ascii=False,separators=(',',':')) for x in rows]
          with open(os.environ['GITHUB_OUTPUT'],'a') as file: print('rows='+json.dumps(serialized,ensure_ascii=False),file=file)
          print(json.dumps(rows,ensure_ascii=False))
  received:
    needs: capture
    strategy:
      matrix:
        data: ${{ fromJson(needs.capture.outputs.rows) }}
    name: ${{ matrix.data }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Closing pair received"
