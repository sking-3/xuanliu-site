name: Apply reviewed public site update
on:
  push:
    branches: [ui/unified-trader-analysis]
    paths: [site-update.json, .github/workflows/apply-reviewable-update.yml]
permissions:
  contents: read
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Apply the exact reviewable source manifest
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          node <<'JS'
          const fs=require('node:fs'),crypto=require('node:crypto'),cp=require('node:child_process');
          const p=JSON.parse(fs.readFileSync('site-update.json','utf8'));
          if(p.schemaVersion!==1||!Array.isArray(p.files)||p.files.length>1000||!/^[a-f0-9]{40}$/.test(p.base))throw Error('invalid manifest');
          const actual=cp.execFileSync('git',['rev-parse','origin/main'],{encoding:'utf8'}).trim();
          if(actual!==p.base)throw Error('main advanced before applying; rebase required');
          for(const f of p.files){
            if(typeof f.path!=='string'||!f.path||f.path.startsWith('/')||f.path.split('/').some(v=>!v||v==='.'||v==='..'||v==='.git')||f.path==='site-update.json'||f.path==='.github/workflows/apply-reviewable-update.yml')throw Error('invalid path');
            const data=Buffer.from(f.base64,'base64');
            if(data.length>15000000||crypto.createHash('sha256').update(data).digest('hex')!==f.sha256)throw Error('invalid content hash');
            fs.mkdirSync(require('node:path').dirname(f.path),{recursive:true});fs.writeFileSync(f.path,data);
          }
          fs.unlinkSync('site-update.json');fs.unlinkSync('.github/workflows/apply-reviewable-update.yml');
          console.log('Applied '+p.files.length+' hash-verified public files.');
          JS
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Unify trader analytics and retain observed positions'
          git push origin HEAD:ui/unified-trader-analysis
