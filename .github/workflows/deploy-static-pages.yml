name: Deploy static Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'trader/feed.json'
      - 'trader/analytics.json'
      - 'trader/portfolios.json'
      - 'trader/binance/snapshot.json'
      - 'trader/binance/portfolios.json'
      - 'trader/aoying-history.js'
      - 'trader/binance/evidence/aoying-analysis-current/**'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: pages
  queue: max
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pin code pushes; other invocations use current main
        id: checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'push' && github.event.after || 'main' }}
          fetch-depth: 1

      - uses: ./.github/actions/setup-public-release

      - name: Gate this exact checkout on offline unit, static and browser checks
        run: node scripts/verify_public_release.cjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Stage the committed public website
        env:
          BOOKS_STAGE_DIR: ${{ runner.temp }}/books-pages
          EXPECTED_SHA: ${{ steps.checkout.outputs.commit }}
        run: node scripts/stage_public_release.cjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/books-pages
          retention-days: 1
          include-hidden-files: true

      - name: Reject an obsolete release before deployment
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ steps.checkout.outputs.commit }}
          BOOKS_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          actual_sha=$(gh api "repos/$BOOKS_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          test "$actual_sha" = "$EXPECTED_SHA" || { echo '::error::main advanced; this artifact will not deploy.'; exit 1; }

      - name: Deploy validated static website
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify the published revision, assets and browser behavior
        env:
          EXPECTED_SHA: ${{ steps.checkout.outputs.commit }}
          RELEASE_BASE_URL: https://sking-3.github.io/xuanliu-site/
        run: node scripts/verify_public_release.cjs --live

      - name: Preserve failed release evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-failure-${{ github.run_id }}-${{ github.job }}
          path: audit/browser-output/release/
          retention-days: 7
