name: Prepare compact trader review
on:
  push:
    branches: [ui/compact-trader-follow]
    paths: [.github/workflows/materialize-compact-review.yml]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Write verified review files
        run: |
          python3 - <<'PYCODE'
          import base64,zlib,json,pathlib,hashlib,subprocess
          payload=zlib.decompress(base64.b64decode(''))
          assert hashlib.sha256(payload).hexdigest()=='98aba77e796667b8c7979bfd497ec1218f8daf5f9ace9da304ad020678a66517'
          files=json.loads(payload)
          for name,entry in files.items():
            p=pathlib.PurePosixPath(name)
            assert not p.is_absolute() and '..' not in p.parts and not name.startswith(('.git/','.github/workflows/'))
            data=base64.b64decode(entry['content']);assert hashlib.sha256(data).hexdigest()==entry['sha256']
            target=pathlib.Path(name);target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(data)
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--',*files],check=True)
          if subprocess.run(['git','diff','--cached','--quiet']).returncode:
            subprocess.run(['git','commit','-m','Compact trader details, restore names and source avatars [skip ci]'],check=True)
            subprocess.run(['git','push','origin','HEAD:ui/compact-trader-follow'],check=True)
          PYCODE
