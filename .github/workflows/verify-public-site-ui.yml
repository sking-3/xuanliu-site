name: Verify public research site
on:
  push:
    branches: [integration/site-release-20261117, ui/public-site-review-20261116, ui/research-evidence-desk, ui/a-share-stock-selection, ui/home-ticker-ranking-fit, ui/verified-long-period-roi, ui/okx-verified-lead-traders, ui/trader-history-bitget, ui/trader-deeplink-recovery, ui/trade-chart-zoom, ui/remove-tape-pause, ui/unified-trader-analysis, ui/compact-trader-follow]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-site:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-public-release
      - name: Verify the candidate without contacting market sources
        run: node scripts/verify_public_release.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-release-regressions
          path: audit/browser-output/release/
          retention-days: 7
  verify-owned-release:
    if: github.event_name == 'pull_request' && github.head_ref == 'codex/verify-native-release-d993'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: d993fcd51b82ceec35ba739a5ba7d0120396782a
          persist-credentials: false
      - uses: ./.github/actions/setup-public-release
      - name: Verify the owned published revision with external market requests blocked
        env:
          EXPECTED_SHA: d993fcd51b82ceec35ba739a5ba7d0120396782a
          RELEASE_BASE_URL: https://sking-3.github.io/xuanliu-site/
        run: node scripts/verify_public_release.cjs --live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-release-published-verification
          path: audit/browser-output/release/
          retention-days: 7
