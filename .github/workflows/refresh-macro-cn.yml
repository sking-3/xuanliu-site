name: Refresh Chinese macro snapshot (manual)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macro-cn-refresh
  queue: max
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Collect official Chinese RSS metadata
        run: python scripts/collect_macro_cn.py --output macro-cn.json
      - name: Validate the public consumer
        run: node --check market-overview.js
      - name: Commit only the macro snapshot
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- macro-cn.json; then
            echo 'No macro snapshot change.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add macro-cn.json
          git commit -m 'data: refresh Chinese macro snapshot'
          git push origin HEAD:main

# A schedule is intentionally absent. Add one only after source frequency and
# publication rights have been reviewed and explicitly approved.
