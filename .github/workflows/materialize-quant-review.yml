name: Prepare web research review
on:
  push:
    branches: [ui/quant-web-research]
    paths: [.github/workflows/materialize-quant-review.yml]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Write verified public files
        run: |
          python3 - <<'PYCODE'
          import base64,zlib,json,pathlib,hashlib,subprocess
          raw=zlib.decompress(base64.b64decode(''))
          assert hashlib.sha256(raw).hexdigest()=='6c0538824c82961ab9c2c618d0bf236eeebe8bcd0768f0d68042f98af3219562'
          files=json.loads(raw)
          for name,entry in files.items():
            p=pathlib.PurePosixPath(name)
            assert not p.is_absolute() and '..' not in p.parts and name.startswith('quant-research/')
            data=base64.b64decode(entry['content']);assert hashlib.sha256(data).hexdigest()==entry['sha256']
            dst=pathlib.Path(name);dst.parent.mkdir(parents=True,exist_ok=True);dst.write_bytes(data)
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--',*files],check=True)
          if subprocess.run(['git','diff','--cached','--quiet']).returncode:
            subprocess.run(['git','commit','-m','Add website research with public data [skip ci]'],check=True)
            subprocess.run(['git','push','origin','HEAD:ui/quant-web-research'],check=True)
          PYCODE
