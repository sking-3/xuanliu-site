name: Refresh Hyperliquid period data and verify production

on:
  workflow_dispatch:
    inputs:
      refresh_scope:
        description: 'Refresh the complete current public account and period bundle'
        type: choice
        required: true
        default: full
        options: [full, positions]
  schedule:
    - cron: '27,57 * * * *'

permissions:
  contents: read

# One bounded public batch. Binance and VPS copy-platform collectors run separately.
concurrency:
  group: hyperliquid-period-bundle
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    outputs:
      published_sha: ${{ steps.save.outputs.sha }}
      updated: ${{ steps.save.outputs.updated }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test shared period rules and source guards
        run: |
          node --check trader/period-metrics.js
          node --check scripts/collect_period_samples.cjs
          node --check scripts/collect_hyperliquid_fills.cjs
          node --test audit/period-metrics-unit.cjs audit/period-samples-collector-unit.cjs
          node --test audit/period-refresh-ui-unit.cjs
          node --test audit/hyperliquid-fills-unit.cjs
          node audit/hyperliquid-run-guard-unit.cjs
          python3 audit/hyperliquid-collector-test.py

      - name: Check durable source stops before any public request
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          # The stop branch is independent of concurrent data/code commits to main.
          git ls-remote --heads origin hyperliquid-period-source-stop > "$RUNNER_TEMP/source-stop-ref"
          if [[ -s "$RUNNER_TEMP/source-stop-ref" ]]; then
            git fetch --no-tags --depth=1 origin hyperliquid-period-source-stop
            git show FETCH_HEAD:trader/period-samples-stop.json > trader/period-samples-stop.json
            printf 'BOOKS_PERIOD_STOP_PERSISTED=true\n' >> "$GITHUB_ENV"
          fi
          gate=$(node scripts/hyperliquid_run_guard.cjs)
          fills_gate=$(node scripts/collect_hyperliquid_fills.cjs --gate)
          if [[ "$fills_gate" != allowed=true ]]; then gate=allowed=false; fi
          if [[ -f trader/period-samples-stop.json ]]; then gate=allowed=false; fi
          case "$gate" in allowed=true|allowed=false) ;; *) exit 1 ;; esac
          printf '%s\n' "$gate" >> "$GITHUB_OUTPUT"

      - name: Read the current official public directory and verify holdings
        id: directory
        if: steps.guard.outputs.allowed == 'true'
        run: python3 -B scripts/collect_hyperliquid.py

      - name: Collect all current accounts with the same period rules
        id: periods
        if: steps.guard.outputs.allowed == 'true' && steps.directory.outcome == 'success'
        env:
          BOOKS_PERIOD_SOURCE_STOP_FILE: trader/period-samples-stop.json
        run: |
          # Clear the directory collector's preceding IP weight window.
          sleep 60
          node scripts/collect_period_samples.cjs --feed trader/feed.json --out trader/period-samples.json --evidence "$RUNNER_TEMP/period-evidence"

      - name: Persist source stops or the complete verified bundle
        id: save
        if: always() && steps.guard.outcome == 'success'
        env:
          PERIODS_OUTCOME: ${{ steps.periods.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ${BOOKS_PERIOD_STOP_PERSISTED-false} == true ]]; then
            printf 'sha=%s\nupdated=false\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$PERIODS_OUTCOME" != success ]]; then
            node -e 'const fs=require("fs"),p=require("./trader/source-policy.js"),s={};for(const k of ["feed","analytics","portfolios"])s[k]=JSON.parse(fs.readFileSync("trader/"+k+".json"));const d=p.decision(s),file="trader/period-samples-stop.json";if(!d.allowed&&!fs.existsSync(file))fs.writeFileSync(file,JSON.stringify({schemaVersion:1,source:"hyperliquid",status:"stopped",errorCode:d.reason,detectedAt:new Date().toISOString()}))'
            if [[ -f trader/period-samples-stop.json ]]; then
              git add -- trader/period-samples-stop.json
              if ! git diff --cached --quiet; then
                git config user.name 'github-actions[bot]'
                git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                git commit -m 'safety: persist Hyperliquid source refusal [skip ci]'
                git push origin HEAD:refs/heads/hyperliquid-period-source-stop
              fi
            fi
            printf 'sha=%s\nupdated=false\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add -- trader/feed.json trader/period-samples.json trader/hyperliquid-fills.json trader/position-history
          changed=false
          if ! git diff --cached --quiet; then
            git fetch --no-tags --depth=1 origin main
            test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'data: refresh verified Hyperliquid period bundle [skip ci]'
            git push origin HEAD:main
            changed=true
          fi
          printf 'sha=%s\nupdated=%s\n' "$(git rev-parse HEAD)" "$changed" >> "$GITHUB_OUTPUT"

      - name: Record bounded source receipts without recurring artifact storage
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'period-evidence'
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
              out.write('\n### Public source receipts\n\n')
              for file in sorted(root.glob('**/*-receipt.json'))[:400]:
                  row=json.loads(file.read_text())
                  out.write(json.dumps({key:row.get(key) for key in ['request','httpStatus','receivedAt','sha256','bytes']})+'\n\n')
          PY

      - name: Keep one manually verified raw evidence batch
        if: always() && github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: hyperliquid-period-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/period-evidence/
          retention-days: 1
          compression-level: 9
          if-no-files-found: ignore

  verify-production:
    needs: collect
    if: needs.collect.outputs.updated == 'true' && needs.collect.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.collect.outputs.published_sha }}
          persist-credentials: false
      - name: Verify the exact period bundle reached the formal site
        run: bash scripts/verify-trader-vps-publication.sh --period-bundle
