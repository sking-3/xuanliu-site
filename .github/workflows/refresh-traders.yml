name: Refresh trader data and deploy Pages

on:
  push:
    branches: [main]
    # Saving a non-secret copy draft must not start full-site source collection.
    paths-ignore:
      - 'copy-config/**'
      - 'tools/copy_plan/**'
      - '.github/workflows/copy-signal-dry-run.yml'
  workflow_dispatch:
    inputs:
      refresh_scope:
        description: 'Refresh all analytics, or only reverify positions for a fast recovery'
        type: choice
        required: true
        default: full
        options: [full, positions]
  schedule:
    # Position checks are frequent; long analytics batches are scheduled separately.
    # GitHub may delay scheduled runs. These schedules do not guarantee delivery.
    - cron: '27,57 * * * *'
    - cron: '12 */6 * * *'

permissions:
  contents: read

# Use the same group for every Pages deployment. Never interrupt a live deploy.
concurrency:
  group: pages
  queue: max
  cancel-in-progress: false

jobs:
  collect-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Serialize Binance requests with the Python watch. UI-only publications
    # never request a source and keep their own unique job group.
    concurrency:
      group: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[ui-only]') && format('binance-ui-only-{0}-{1}', github.run_id, github.run_attempt) || 'binance-public-source' }}
      queue: max
      cancel-in-progress: false
    permissions:
      contents: write
      pages: read
      actions: read
    outputs:
      published_sha: ${{ steps.snapshot.outputs.sha }}
    steps:
      - name: Check out the latest main branch
        id: checkout
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Resolve Hyperliquid refresh scope
        id: refresh-mode
        env:
          BOOKS_CHECKOUT_SHA: ${{ steps.checkout.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          mode=$(node scripts/resolve_trader_refresh_mode.cjs)
          printf 'mode=%s\n' "$mode" >> "$GITHUB_OUTPUT"
          printf 'Hyperliquid refresh scope: %s\n' "$mode" >> "$GITHUB_STEP_SUMMARY"

      - name: Test navigation and account page logic
        run: |
          node --check trader/period-roi.js
          node audit/period-roi-unit.cjs
          node --check home-trader-data.js
          node --check home-ranking.js
          node audit/home-trader-data-unit.cjs
          node audit/home-ranking-ui-unit.cjs
          node --check books-shell.js
          node audit/shell-unit.cjs
          node audit/market-live-unit.cjs
          node --check trader/account-live.js
          node --check trader/account-analytics.js
          node --check trader/plaza.js
          node audit/account-live-unit.cjs
          node audit/account-analytics-unit.cjs
          node --check scripts/collect_trader_analytics.cjs
          node audit/trader-analytics-collector-unit.cjs
          node --check scripts/collect_trader_portfolios.cjs
          node audit/trader-portfolio-collector-unit.cjs
          node --check scripts/resolve_trader_refresh_mode.cjs
          node audit/trader-refresh-mode-unit.cjs
          node --check scripts/hyperliquid_run_guard.cjs
          node audit/hyperliquid-run-guard-unit.cjs
          node --check scripts/refresh_trader_positions.cjs
          node audit/refresh-trader-positions-unit.cjs
          node audit/trader-unit.cjs
          node --check scripts/collect_binance.cjs
          node --check trader/binance-data.js
          node audit/binance-plaza-data-unit.cjs
          node --check trader/binance/redirect.js
          node audit/binance-redirect-unit.cjs
          node --check trader/binance/monitor.js
          node audit/binance-collector-unit.cjs
          node audit/binance-multi-unit.cjs
          node audit/binance-run-guard-unit.cjs
          node audit/binance-ui-unit.cjs

      - name: Test snapshot validation and last-good handling
        run: python3 -B audit/hyperliquid-collector-test.py

      - name: Check persisted Hyperliquid source refusals
        id: hyperliquid-guard
        if: steps.refresh-mode.outputs.mode != 'skip'
        shell: bash
        run: |
          set -euo pipefail
          gate=$(node scripts/hyperliquid_run_guard.cjs)
          case "$gate" in allowed=true|allowed=false) ;; *) exit 1 ;; esac
          printf '%s\n' "$gate" >> "$GITHUB_OUTPUT"
          printf 'Hyperliquid persisted-source guard: %s\n' "$gate" >> "$GITHUB_STEP_SUMMARY"

      # UI-only publication skips every source; other modes retain independent Binance guards.
      # Positions preserve analysis files and their original timestamps; full also refreshes analytics.
      # UI-only pushes reuse all committed snapshots. Tests and deployment remain required.
      - name: Record this collection start
        if: steps.refresh-mode.outputs.mode != 'skip' && steps.hyperliquid-guard.outputs.allowed == 'true'
        shell: bash
        run: printf 'BOOKS_COLLECTION_STARTED_AT=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Collect one public Hyperliquid snapshot
        if: steps.refresh-mode.outputs.mode != 'skip' && steps.hyperliquid-guard.outputs.allowed == 'true'
        # Source failures produce a stale last-good snapshot, not invented data.
        run: python3 -B scripts/collect_hyperliquid.py

      - name: Precompute native and 90/180/365-day portfolio windows
        if: steps.refresh-mode.outputs.mode == 'full' && steps.hyperliquid-guard.outputs.allowed == 'true'
        # At most 600 weight/minute; only real source samples are retained.
        run: node scripts/collect_trader_portfolios.cjs

      - name: Separate shared API rate windows
        if: steps.refresh-mode.outputs.mode == 'full' && steps.hyperliquid-guard.outputs.allowed == 'true'
        # The next worker has its own rolling budget. Let this source's prior window expire.
        run: sleep 60

      - name: Precompute closing-fill win rates with persistent last-good cache
        if: steps.refresh-mode.outputs.mode == 'full' && steps.hyperliquid-guard.outputs.allowed == 'true'
        # At most 900 weight/minute; a 403/429 stops the batch. No raw fills are published.
        # A cold batch may take up to 22 minutes; missing/old accounts go first next time.
        run: node scripts/collect_trader_analytics.cjs --portfolio-status trader/portfolios.json

      - name: Reverify holdings after the long analytics batch
        if: steps.refresh-mode.outputs.mode == 'full' && steps.hyperliquid-guard.outputs.allowed == 'true'
        # Do not publish holdings that aged while win rates were calculated.
        # Any same-run 403/429 stops this final check; the wrapper validates all three source statuses.
        shell: bash
        run: |
          sleep 60
          node scripts/refresh_trader_positions.cjs --not-before "$BOOKS_COLLECTION_STARTED_AT"

      - name: Select the latest Python Binance source checkpoint
        id: binance-peer-select
        if: steps.refresh-mode.outputs.mode != 'skip'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 -B tools/binance_watch/actions_state.py select-peer
          --directory "$RUNNER_TEMP/binance-watch-peer"
          --selection "$RUNNER_TEMP/binance-watch-peer-selection.json"

      - name: Restore the exact Python Binance source checkpoint
        id: binance-peer-restore
        if: steps.refresh-mode.outputs.mode != 'skip' && steps.binance-peer-select.outcome == 'success' && steps.binance-peer-select.outputs.restore_run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.binance-peer-select.outputs.restore_artifact_id }}
          run-id: ${{ steps.binance-peer-select.outputs.restore_run_id }}
          github-token: ${{ github.token }}
          repository: sking-3/xuanliu-site
          path: ${{ runner.temp }}/binance-watch-peer
          merge-multiple: true

      - name: Validate the Python Binance global source-stop state
        id: binance-peer-validate
        if: steps.refresh-mode.outputs.mode != 'skip' && steps.binance-peer-select.outcome == 'success' && (steps.binance-peer-select.outputs.restore_run_id == '' || steps.binance-peer-restore.outcome == 'success')
        continue-on-error: true
        run: >-
          python3 -B tools/binance_watch/actions_state.py validate-peer
          --directory "$RUNNER_TEMP/binance-watch-peer"
          --selection "$RUNNER_TEMP/binance-watch-peer-selection.json"

      - name: Report blocked Binance collection without changing its snapshots
        if: steps.refresh-mode.outputs.mode != 'skip'
        env:
          BINANCE_PEER_ALLOWED: ${{ steps.binance-peer-validate.outputs.allowed }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$BINANCE_PEER_ALLOWED" != "true" ]; then
            printf '%s\n' 'Binance source collection skipped: the Python watch reported a global stop or its checkpoint could not be verified. Existing Binance snapshots and timestamps are preserved. Hyperliquid and publication retain their existing guards.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Verify the preceding Binance run was safely committed
        id: binance-guard
        if: steps.refresh-mode.outputs.mode != 'skip' && steps.binance-peer-validate.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          guard=$(node scripts/binance_run_guard.cjs)
          if [ "$guard" = "halt" ]; then
            echo 'BINANCE_PREVIOUS_RUN_UNVERIFIED=1' >> "$GITHUB_ENV"
          elif [ "$guard" != "ok" ]; then
            exit 1
          fi

      - name: Collect the public Binance lead sample
        if: steps.refresh-mode.outputs.mode != 'skip' && steps.binance-peer-validate.outputs.allowed == 'true'
        # Anonymous read-only sample. Access refusal is persisted; halted sources are not retried.
        run: node scripts/collect_binance.cjs

      - name: Save the snapshot without overwriting concurrent edits
        id: snapshot
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo '::error::main changed during collection. Skipping this deployment; a later run will use the new version.'
            exit 1
          fi
          git add -- trader/feed.json trader/analytics.json trader/portfolios.json trader/binance/snapshot.json trader/binance/portfolios.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore: refresh public trader snapshot [skip ci]'
            # A normal push rejects a concurrent main update; never force or rebase.
            git push origin HEAD:main
          fi
          printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Stage only the committed website
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/books-pages"
          git archive --format=tar HEAD | tar -x -C "$RUNNER_TEMP/books-pages"
          test -s "$RUNNER_TEMP/books-pages/index.html"
          test -s "$RUNNER_TEMP/books-pages/trader/feed.json"
          test -s "$RUNNER_TEMP/books-pages/trader/analytics.json"
          test -s "$RUNNER_TEMP/books-pages/trader/portfolios.json"
          test -s "$RUNNER_TEMP/books-pages/trader/binance/snapshot.json"
          test -s "$RUNNER_TEMP/books-pages/trader/binance/portfolios.json"
          # Raw downloads and test temporary files are never part of git archive.

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/books-pages
          retention-days: 1
          include-hidden-files: true

  deploy:
    needs: collect-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Stop if main advanced after this artifact was built
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ needs.collect-build.outputs.published_sha }}
          BOOKS_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          actual_sha=$(gh api "repos/$BOOKS_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$actual_sha" != "$EXPECTED_SHA" ]; then
            echo '::error::A newer main commit exists. Skipping this older Pages artifact.'
            exit 1
          fi
          printf 'Website commit: `%s`\n' "$EXPECTED_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy the validated website and snapshot
        id: deployment
        uses: actions/deploy-pages@v4
