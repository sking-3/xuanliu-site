name: Refresh trader data and deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh_scope:
        description: 'Refresh all analytics, or only reverify positions for a fast recovery'
        type: choice
        required: true
        default: full
        options: [full, positions]
  schedule:
    # Offset from the hour; GitHub may delay scheduled runs.
    - cron: '27,57 * * * *'

permissions:
  contents: read

# Use the same group for every Pages deployment. Never interrupt a live deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collect-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      pages: read
    outputs:
      published_sha: ${{ steps.snapshot.outputs.sha }}
    steps:
      - name: Check out the latest main branch
        id: checkout
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Test navigation and account page logic
        run: |
          node --check books-shell.js
          node audit/shell-unit.cjs
          node --check trader/account-live.js
          node --check trader/account-analytics.js
          node --check trader/plaza.js
          node audit/account-live-unit.cjs
          node audit/account-analytics-unit.cjs
          node --check scripts/collect_trader_analytics.cjs
          node audit/trader-analytics-collector-unit.cjs
          node --check scripts/collect_trader_portfolios.cjs
          node audit/trader-portfolio-collector-unit.cjs
          node audit/trader-unit.cjs

      - name: Test snapshot validation and last-good handling
        run: python3 -B audit/hyperliquid-collector-test.py

      # UI-only pushes reuse snapshots. Positions-only recovery rechecks holdings but retains analytics timestamps.
      # Scheduled runs always collect all data; delayed push events checking out newer code also collect fully.
      # Tests, commit consistency checks, and deployment remain required for every push.
      - name: Collect one public Hyperliquid snapshot
        if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[ui-only]') || github.event.after != steps.checkout.outputs.commit
        # Source failures produce a stale last-good snapshot, not invented data.
        run: python3 -B scripts/collect_hyperliquid.py

      - name: Precompute native and 90/180/365-day portfolio windows
        if: >-
          (github.event_name != 'push' || !contains(github.event.head_commit.message, '[ui-only]') || github.event.after != steps.checkout.outputs.commit) &&
          !(github.event_name == 'workflow_dispatch' && inputs.refresh_scope == 'positions') &&
          !(github.event_name == 'push' && contains(github.event.head_commit.message, '[positions-only]') && github.event.after == steps.checkout.outputs.commit)
        # At most 600 weight/minute; only real source samples are retained.
        run: node scripts/collect_trader_portfolios.cjs

      - name: Separate shared API rate windows
        if: >-
          (github.event_name != 'push' || !contains(github.event.head_commit.message, '[ui-only]') || github.event.after != steps.checkout.outputs.commit) &&
          !(github.event_name == 'workflow_dispatch' && inputs.refresh_scope == 'positions') &&
          !(github.event_name == 'push' && contains(github.event.head_commit.message, '[positions-only]') && github.event.after == steps.checkout.outputs.commit)
        # The next worker has its own rolling budget. Let this source's prior window expire.
        run: sleep 60

      - name: Precompute closing-fill win rates with persistent last-good cache
        if: >-
          (github.event_name != 'push' || !contains(github.event.head_commit.message, '[ui-only]') || github.event.after != steps.checkout.outputs.commit) &&
          !(github.event_name == 'workflow_dispatch' && inputs.refresh_scope == 'positions') &&
          !(github.event_name == 'push' && contains(github.event.head_commit.message, '[positions-only]') && github.event.after == steps.checkout.outputs.commit)
        # At most 900 weight/minute; a 403/429 stops the batch. No raw fills are published.
        # A cold batch may take up to 22 minutes; missing/old accounts go first next time.
        run: node scripts/collect_trader_analytics.cjs --portfolio-status trader/portfolios.json

      - name: Save the snapshot without overwriting concurrent edits
        id: snapshot
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo '::error::main changed during collection. Skipping this deployment; a later run will use the new version.'
            exit 1
          fi
          git add -- trader/feed.json trader/analytics.json trader/portfolios.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore: refresh public trader snapshot [skip ci]'
            # A normal push rejects a concurrent main update; never force or rebase.
            git push origin HEAD:main
          fi
          printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Stage only the committed website
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/books-pages"
          git archive --format=tar HEAD | tar -x -C "$RUNNER_TEMP/books-pages"
          test -s "$RUNNER_TEMP/books-pages/index.html"
          test -s "$RUNNER_TEMP/books-pages/trader/feed.json"
          test -s "$RUNNER_TEMP/books-pages/trader/analytics.json"
          test -s "$RUNNER_TEMP/books-pages/trader/portfolios.json"
          # Raw downloads and test temporary files are never part of git archive.

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/books-pages
          retention-days: 1
          include-hidden-files: true

  deploy:
    needs: collect-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Stop if main advanced after this artifact was built
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ needs.collect-build.outputs.published_sha }}
          BOOKS_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          actual_sha=$(gh api "repos/$BOOKS_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$actual_sha" != "$EXPECTED_SHA" ]; then
            echo '::error::A newer main commit exists. Skipping this older Pages artifact.'
            exit 1
          fi
          printf 'Website commit: `%s`\n' "$EXPECTED_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy the validated website and snapshot
        id: deployment
        uses: actions/deploy-pages@v4
