name: Read official OKX public traders
on:
  push:
    branches: [check/okx-public-period-review]
    paths: ['.github/workflows/check-okx-public.yml']
permissions: {}
jobs:
  official:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Sampler for the public contract leaderboard and cumulative PnL
        shell: node {0}
        run: |
          (async()=>{
            const zip=require('node:zlib');const url='https://www.okx.com/api/v5/copytrading/';let stopped=false;
            async function read(name,path){
             const u=url+path;const res=await fetch(u,{headers:{accept:'application/json'},redirect:'error',signal:AbortSignal.timeout(18000)});
             const raw=Buffer.from(await res.arrayBuffer());const when=new Date().toISOString();let body;try{body=JSON.parse(raw)}catch{}
             console.log('OKX_STATUS '+JSON.stringify({name,sourceUrl:u,httpStatus:res.status,receivedAt:when,code:body?.code??null,bytes:raw.length,msg:String(body?.msg??'').slice(0,160)}));
             if(res.status!==200||body?.code!=='0'){stopped=true;return null;}
             const data=zip.gzipSync(raw).toString('base64');for(let i=0;i<data.length;i+=4000)console.log('OKX_RAW '+JSON.stringify([name,data.slice(i,i+4000)]));
             return body.data;
            }
            for (const id of ['811846999954962957','CB312175A85C9B68','807517291536749293','7E27C9B14BB5D378','D442CF34E4AEEAF1','A83A52C0C7F33A43']) {
              if(stopped)break;
              await new Promise(f=>setTimeout(f,650));
              await read(id+'-2','public-pnl?instType=SWAP&uniqueCode='+id+'&lastDays=2');
            }
          })().catch(e=>{console.error(e);process.exitCode=1;});
