name: Verify mootdx feed
on:
  pull_request:
    paths:
      - 'tools/mootdx_feed/**'
      - 'scripts/requirements-mootdx.txt'
      - 'scripts/source-holds.json'
      - 'tools/binance_watch/source_holds.py'
      - '.github/workflows/verify-mootdx-feed.yml'
  push:
    branches: ['codex/mootdx-feed']
    paths:
      - 'tools/mootdx_feed/**'
      - 'scripts/requirements-mootdx.txt'
      - 'scripts/source-holds.json'
      - 'tools/binance_watch/source_holds.py'
      - '.github/workflows/verify-mootdx-feed.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install the full hash lock into a fresh environment
        run: |
          python -m venv "$RUNNER_TEMP/mootdx-feed"
          "$RUNNER_TEMP/mootdx-feed/bin/python" -m pip install --force-reinstall --require-hashes --only-binary=:all: -r scripts/requirements-mootdx.txt
          "$RUNNER_TEMP/mootdx-feed/bin/python" -m pip check
      - name: Check syntax, provider imports and offline behavior
        run: |
          "$RUNNER_TEMP/mootdx-feed/bin/python" -m compileall -q tools/mootdx_feed
          "$RUNNER_TEMP/mootdx-feed/bin/python" -B -m unittest tools.mootdx_feed.test_collector -v
          "$RUNNER_TEMP/mootdx-feed/bin/python" -m tools.mootdx_feed.collector --help
