name: Verify mootdx feed
on:
  pull_request:
    paths:
      - 'tools/mootdx_feed/**'
      - 'scripts/requirements-mootdx.txt'
      - '.github/workflows/verify-mootdx-feed.yml'
  push:
    branches: ['codex/mootdx-feed']
    paths:
      - 'tools/mootdx_feed/**'
      - 'scripts/requirements-mootdx.txt'
      - '.github/workflows/verify-mootdx-feed.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install the isolated, pinned feed dependencies
        run: python -m pip install -r scripts/requirements-mootdx.txt
      - name: Check syntax, provider imports and offline behavior
        run: |
          python -m compileall -q tools/mootdx_feed
          python -B -m unittest tools.mootdx_feed.test_collector -v
          python -m tools.mootdx_feed.collector --help
