name: Verify mootdx feed
on:
  pull_request:
    paths:
      - 'tools/mootdx_feed/**'
      - 'scripts/requirements-mootdx.txt'
      - '.github/workflows/verify-mootdx-feed.yml'
  push:
    branches: ['codex/mootdx-feed']
    paths:
      - 'tools/mootdx_feed/**'
      - 'scripts/requirements-mootdx.txt'
      - '.github/workflows/verify-mootdx-feed.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install the isolated, pinned feed dependencies
        run: python -m pip install -r scripts/requirements-mootdx.txt
      - name: Generate complete dependency hash draft for review
        run: |
          python - <<'PY'
          import importlib.metadata
          import json
          import re
          import urllib.request
          lines = ["# Exact environment resolution; SHA256 digests from PyPI release metadata.",
                   "# Generated on GitHub Actions ubuntu-24.04; not a security audit."]
          for package in sorted(importlib.metadata.distributions(), key=lambda p: p.metadata["Name"].lower()):
              name, version = package.metadata["Name"], package.version
              if name.lower() == "pip":
                  continue
              if not re.fullmatch(r"[A-Za-z0-9_.-]+", name) or not re.fullmatch(r"[A-Za-z0-9_.+!-]+", version):
                  raise ValueError("Unexpected package identifier")
              url = f"https://pypi.org/pypi/{name}/{version}/json"
              with urllib.request.urlopen(url, timeout=30) as response:
                  metadata = json.load(response)
              hashes = sorted({artifact["digests"]["sha256"] for artifact in metadata["urls"]})
              if not hashes or any(not re.fullmatch(r"[0-9a-f]{64}", value) for value in hashes):
                  raise ValueError("Missing package hashes")
              lines.append(name + "==" + version + " " + " ".join("--hash=sha256:" + value for value in hashes))
          print("LOCKFILE_BEGIN")
          print("\n".join(lines))
          print("LOCKFILE_END")
          PY
      - name: Check syntax, provider imports and offline behavior
        run: |
          python -m compileall -q tools/mootdx_feed
          python -B -m unittest tools.mootdx_feed.test_collector -v
          python -m tools.mootdx_feed.collector --help
