<main class="book-demo" id="content"><header class="desk-heading"><h1>Bitget 公开实时盘口</h1><p>公开 USDT 永续市场的最佳买卖价，只用于行情核验，不连接账户或下单。</p></header><section class="desk-paper">
<label>合约 <select id="symbol"><option>BTCUSDT</option><option>ETHUSDT</option><option>NVDAUSDT</option></select></label>
<output id="status" role="status" aria-live="polite">正在连接…</output><dl><dt>买一价 / 数量</dt><dd id="bid">—</dd><dt>卖一价 / 数量</dt><dd id="ask">—</dd><dt>来源时间</dt><dd id="source-time">—</dd><dt>接收时间</dt><dd id="received-time">—</dd></dl>
<p class="warning">盘口变动时推送；超过 5 秒未收到有效新盘口会标为过期，不可作为新鲜行情。持仓、带单信号和交易所带单资格需另行验证。</p></section></main>
<script src="bitget-book-stream.js"></script><script>
let client;const byId=id=>document.getElementById(id),date=t=>new Date(t).toLocaleString('zh-CN',{hour12:false});
function render(s){byId('status').textContent=(({idle:'未连接',connecting:'连接中',live:'实时盘口已连接',stale:'行情已过期',disconnected:'连接中断',error:'行情连接不可用',stopped:'已停止'})[s.status]||s.status)+(s.reason?' · '+s.reason:'');for(const side of ['bid','ask'])byId(side).textContent=s.quote?(s.usable?'':'上次（已失效） ')+s.quote[side].price+' / '+s.quote[side].quantity:'—';byId('source-time').textContent=s.quote?date(s.quote.sourceTime):'—';byId('received-time').textContent=s.quote?date(s.quote.receivedAt):'—';}
function connect(){if(client)client.stop();client=BooksBitgetBookStream.create({symbol:byId('symbol').value,onChange:render});client.start();}byId('symbol').addEventListener('change',connect);document.addEventListener('visibilitychange',()=>{if(document.hidden){if(client)client.stop();}else connect();});setInterval(()=>{if(client)render(client.getState());},1000);connect();
</script></body></html>
